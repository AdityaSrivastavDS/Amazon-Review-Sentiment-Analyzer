<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Sentiment Analysis Result</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root {
        --primary-color: #6c5ce7;
        --secondary-color: #a29bfe;
        --dark-bg: #1a1a1a;
        --card-bg: #2d2d2d;
        --text-color: #ffffff;
        --input-bg: #3d3d3d;
        --success-color: #00b894;
        --info-color: #0984e3;
      }

      body {
        background-color: var(--dark-bg);
        color: var(--text-color);
        min-height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      .container {
        margin-top: 50px;
        perspective: 1000px;
      }

      .card {
        background-color: var(--card-bg);
        border: none;
        border-radius: 15px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        transform-style: preserve-3d;
        transition: transform 0.5s ease;
      }

      .card:hover {
        transform: translateY(-10px) rotateX(5deg);
      }

      .card-header {
        background: linear-gradient(135deg, var(--success-color), var(--info-color));
        border-radius: 15px 15px 0 0 !important;
        padding: 2rem;
      }

      .card-header h1 {
        font-size: 2.5rem;
        font-weight: 700;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
      }

      .card-body {
        padding: 2rem;
      }

      .card-body p {
        font-size: 1.1rem;
        margin-bottom: 1rem;
        padding: 0.8rem;
        background-color: var(--input-bg);
        border-radius: 8px;
        transition: all 0.3s ease;
      }

      .card-body p:hover {
        transform: translateX(5px);
        box-shadow: 0 0 15px rgba(0, 184, 148, 0.3);
      }

      .card-body p strong {
        color: var(--success-color);
      }

      .img-fluid {
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
      }

      .img-fluid:hover {
        transform: scale(1.02);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        border: none;
        padding: 0.8rem 2rem;
        font-size: 1.1rem;
        border-radius: 10px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        margin-top: 1.5rem;
      }

      .btn-primary:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(108, 92, 231, 0.6);
      }

      .btn-primary:active {
        transform: translateY(1px);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .card {
        animation: fadeIn 0.8s ease-out;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(-20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .card-body p {
        animation: slideIn 0.5s ease-out forwards;
      }

      .card-body p:nth-child(1) { animation-delay: 0.1s; }
      .card-body p:nth-child(2) { animation-delay: 0.2s; }
      .card-body p:nth-child(3) { animation-delay: 0.3s; }
      .card-body p:nth-child(4) { animation-delay: 0.4s; }
      .card-body p:nth-child(5) { animation-delay: 0.5s; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="card-header bg-success text-white">
          <h1>Sentiment Analysis Result</h1>
        </div>
        <div class="card-body">
          <p><strong>Review:</strong> {{ text }}</p>
          <p><strong>Negative:</strong> {{ scores.neg }}</p>
          <p><strong>Neutral:</strong> {{ scores.neu }}</p>
          <p><strong>Positive:</strong> {{ scores.pos }}</p>
          <p><strong>Compound:</strong> {{ scores.compound }}</p>
          <img src="{{ url_for('static', filename='sentiment_pie.png') }}" class="img-fluid" alt="Sentiment Pie Chart">
          <br><br>
          <a href="/" class="btn btn-primary">Analyze another review</a>
        </div>
      </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  </body>
</html>
